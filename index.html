<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101d2a">
<title>Sprout — a tiny world together</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Sprout home"><span class="brand-mark">✿</span><span>sprout<span class="brand-dot">.</span></span></a>
    <div class="world-title"><span class="online-dot"></span><div><strong id="world-name">SUNNY MEADOW</strong><small id="world-status">your little corner of the world</small></div></div>
    <div class="top-actions"><div class="players-pill"><span class="players-icon">♙</span><span id="player-count">1</span><span class="players-label">here</span></div><button class="icon-btn" id="sound-btn" aria-label="Toggle sound">♫</button><button class="icon-btn menu-btn" id="help-btn" aria-label="Help">?</button></div>
  </header>
  <section class="game-area" id="game-area">
    <canvas id="game" aria-label="2D sandbox game world"></canvas>
    <div class="sky-label"><span class="sun-icon">☀</span> DAY 01 <i></i> 10:24 AM</div>
    <div class="world-toast" id="toast">Welcome to your world!</div>
    <div class="hud-card profile-card"><div class="avatar-mini">☺</div><div><strong id="player-name">little sprout</strong><small><span class="rank-dot"></span> World gardener</small></div><button class="edit-name" id="rename-btn" title="Change name">✎</button></div>
    <div class="hud-card quest-card"><div class="quest-icon">✦</div><div class="quest-copy"><small>YOUR LITTLE QUEST</small><strong id="quest-text">Gather 5 wood</strong><div class="quest-progress"><span id="quest-fill"></span></div></div><span class="quest-count" id="quest-count">0/5</span></div>
    <div class="action-hint" id="action-hint">TAP A BLOCK TO HARVEST</div>
    <div class="mobile-controls" aria-label="Movement controls"><button class="move-btn" id="left-btn" aria-label="Move left">‹</button><button class="move-btn jump-btn" id="jump-btn" aria-label="Jump">↑</button><button class="move-btn" id="right-btn" aria-label="Move right">›</button></div>
    <div class="action-controls"><button id="mine-btn" class="action-btn mine-action"><span>⛏</span><small>MINE</small></button><button id="place-btn" class="action-btn place-action"><span>＋</span><small>PLACE</small></button></div>
  </section>
  <footer class="bottom-ui">
    <div class="tool-tray"><div class="tray-label">YOUR POCKETS</div><div class="hotbar" id="hotbar"></div><button class="inventory-more" id="inventory-btn" title="Inventory">⌄</button></div>
    <div class="chat-bar"><span class="chat-bubble">✉</span><input id="chat-input" type="text" maxlength="90" placeholder="Say something nice..." autocomplete="off"><button id="send-chat" aria-label="Send message">➤</button><button class="chat-history" id="history-btn" aria-label="Open chat">☷</button></div>
  </footer>
  <div class="chat-feed" id="chat-feed" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="modal-backdrop"><section class="modal" id="modal"></section></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
</main>
<script src="game.js"></script>
</body>
</html>
